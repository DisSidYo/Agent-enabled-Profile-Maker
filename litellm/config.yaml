model_list:
  - model_name: primary
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: fallback
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY

litellm_settings:
  # every call through the proxy gets logged to Langfuse as a trace
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

router_settings:
  # if "primary" errors or times out, automatically retry on "fallback"
  fallbacks:
    - primary: ["fallback"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
